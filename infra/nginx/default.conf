# Ingest debug: body + upstream error reason visible in `docker compose logs frontend`.
# $request_body is filled only when request buffering is on (see location /api/).
log_format ingest_debug '$remote_addr [$time_local] "$request" $status '
                        'ua="$http_user_agent" '
                        'ctype="$content_type" clen=$content_length '
                        'err="$upstream_http_x_ingest_error" '
                        'body="$request_body"';

server {
    listen 80;
    server_name agromir-stat.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Plain HTTP by IP for the PLC / WinCC: no redirect, no TLS.
server {
    listen 80 default_server;
    server_name 168.113.176.218 _;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        access_log /var/log/nginx/access.log ingest_debug;
        client_body_buffer_size 512k;
        # Buffering required so $request_body appears in access log.
        proxy_request_buffering on;

        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;

        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name agromir-stat.online;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # SSL конфигурация (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/agromir-stat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agromir-stat.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/agromir-stat.online/chain.pem;

    # Оптимизация SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        access_log /var/log/nginx/access.log ingest_debug;
        client_body_buffer_size 512k;
        proxy_request_buffering on;

        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;

        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2100s;
        proxy_send_timeout    2100s;
        proxy_read_timeout    2100s;

        keepalive_timeout     2100s;
        client_max_body_size 100M;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
